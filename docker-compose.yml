version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: recalltracer-falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recalltracer-app
    ports:
      - "8501:8501"
      - "8502:8502"
    environment:
      - FALKOR_HOST=falkordb
      - FALKOR_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  falkordb_data:
