version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: recalltracer-falkordb
    command: ["redis-server", "--maxmemory", "2gb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recalltracer-app
    ports:
      - "8501:8501"
      - "8502:8502"
    environment:
      - FALKOR_HOST=falkordb
      - FALKOR_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-qwen/qwen3-4b-2507}
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  falkordb_data:
